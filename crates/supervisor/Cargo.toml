[package]
name = "hearthrun-supervisor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
native-verification = []

[[test]]
name = "publication_acceptance"
path = "../../tests/acceptance_locked/publication.rs"
required-features = ["native-verification"]

[[test]]
name = "artifact_acceptance"
path = "../../tests/acceptance_locked/artifacts.rs"
required-features = ["native-verification"]

[[test]]
name = "quiescence_acceptance"
path = "../../tests/acceptance_locked/quiescence.rs"
required-features = ["native-verification"]

[[test]]
name = "doctor_acceptance"
path = "../../tests/acceptance_locked/doctor.rs"
required-features = ["native-verification"]

[dependencies]
hearthrun-domain.workspace = true
hearthrun-launcher.workspace = true
rustix.workspace = true
libc.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
