required-features = ["native-verification"]

[[test]]
name = "filesystem_acceptance"
path = "../../tests/acceptance_locked/filesystem.rs"
required-features = ["native-verification"]

[[test]]
name = "authority_acceptance"
path = "../../tests/acceptance_locked/authority.rs"
