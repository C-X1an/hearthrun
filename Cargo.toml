[workspace]
members = ["crates/domain", "crates/launcher", "crates/supervisor", "crates/cli"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
hearthrun-domain = { path = "crates/domain" }
hearthrun-launcher = { path = "crates/launcher" }
libc = "=0.2.191"
rustix = { version = "=1.1.6", features = ["event", "fs", "mount", "net", "pipe", "process", "rand", "stdio", "system", "thread"] }
sha2 = "=0.11.0"
serde = "=1.0.229"
serde_json = "=1.0.151"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
